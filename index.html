<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TodayToDo</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --card: #f6f8fa;
    --accent: #1a7f37; --accent-soft: #dafbe1; --link: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --card: #151b23;
      --accent: #3fb950; --accent-soft: #12261e; --link: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  header { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; color: var(--fg); text-decoration: none; margin-right: auto; }
  .logo span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; font-size: 15px; padding: 4px 2px; }
  nav a.on, nav a:hover { color: var(--fg); }
  nav { display: flex; gap: 14px; flex-wrap: wrap; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--link); }
  h1 { font-size: 1.6em; margin: 0 0 .6em; } h2 { font-size: 1.3em; margin-top: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.1em; margin-top: 1.6em; }
  blockquote { margin: 1em 0; padding: .4em 1em; border-left: 4px solid var(--accent); background: var(--card); color: var(--fg); border-radius: 0 6px 6px 0; }
  blockquote p { margin: .3em 0; }
  code { background: var(--card); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
  pre { background: var(--card); padding: 12px; border-radius: 6px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; white-space: nowrap; }
  details { background: var(--card); border-radius: 6px; padding: 6px 10px; margin: 4px 0 12px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  img { max-width: 100%; }
  .heat { background: #fff; border-radius: 8px; padding: 10px; display: inline-block; max-width: 100%; overflow-x: auto; }
  .note { margin-top: 40px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 4px 20px 12px; }
  .list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .list a { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--fg); }
  .list a:hover { border-color: var(--accent); }
  .list small { color: var(--muted); display: block; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .mermaid { background: #fff; border-radius: 8px; padding: 12px; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#/">Today<span>ToDo</span></a>
    <nav>
      <a href="#/" data-nav="today">오늘</a>
      <a href="#/days" data-nav="days">지난 기록</a>
      <a href="#/concepts" data-nav="concepts">개념 아카이브</a>
      <a href="#/weekly" data-nav="weekly">주간 리포트</a>
    </nav>
  </div>
</header>
<main id="app"><p class="empty">불러오는 중…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const app = document.getElementById("app");
mermaid.initialize({ startOnLoad: false, theme: "default" });
let site = null;

async function text(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.text();
}

// 생성된 마크다운에는 뉴스 제목이 들어가므로 항상 정화한 뒤 넣는다
function md(src) {
  const box = document.createElement("div");
  box.innerHTML = DOMPurify.sanitize(marked.parse(src));
  box.querySelectorAll("code.language-mermaid").forEach(code => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  box.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    let m;
    if ((m = href.match(/(?:^|\/)(\d{4}-\d{2}-\d{2})\.md$/))) a.href = `#/day/${m[1]}`;
    else if (/(^|\/)concepts\.md$/.test(href)) a.href = "#/concepts";
    else if ((m = href.match(/weekly\/([\w-]+)\.md$/))) a.href = `#/weekly/${m[1]}`;
    else if (/^weekly\/?$/.test(href)) a.href = "#/weekly";
    else if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
  });
  return box;
}

async function show(...nodes) {
  app.replaceChildren(...nodes);
  const graphs = app.querySelectorAll(".mermaid");
  if (graphs.length) await mermaid.run({ nodes: graphs });
  window.scrollTo(0, 0);
}

function el(tag, attrs = {}, children = []) {
  const e = Object.assign(document.createElement(tag), attrs);
  e.append(...children);
  return e;
}

async function dayView(date) {
  const parts = [md(await text(`daily/${date}.md`))];
  try {
    const note = md((await text(`notes/${date}.md`)).replace(/^subject:.*$/im, ""));
    note.className = "note";
    note.prepend(el("h2", { textContent: "📝 내 노트" }));
    parts.push(note);
  } catch { /* 아직 노트를 안 쓴 날 */ }
  return parts;
}

const routes = [
  [/^#?\/?$/, "today", async () => {
    if (!site.dates.length) return [el("p", { className: "empty", textContent: "아직 첫 실행 전입니다. Actions에서 daily 워크플로를 실행해 주세요." })];
    const heat = el("div", { className: "heat" }, [el("img", { src: `assets/heatmap.svg?v=${site.dates[0]}`, alt: "최근 20주 공부 잔디" })]);
    return [heat, ...(await dayView(site.dates[0]))];
  }],
  [/^#\/day\/(\d{4}-\d{2}-\d{2})$/, "days", (d) => dayView(d)],
  [/^#\/days$/, "days", async () => [
    el("h1", { textContent: "지난 기록" }),
    el("ul", { className: "list" }, site.dates.map(d => el("li", {}, [
      el("a", { href: `#/day/${d}` }, [d, el("small", { textContent: (site.titles[d] || []).join(" · ") })])]))),
  ]],
  [/^#\/concepts$/, "concepts", async () => [md(await text("concepts.md"))]],
  [/^#\/weekly$/, "weekly", async () => site.weeks.length
    ? [el("h1", { textContent: "주간 리포트" }),
       el("ul", { className: "list" }, site.weeks.map(w => el("li", {}, [el("a", { href: `#/weekly/${w}`, textContent: w })])))]
    : [el("p", { className: "empty", textContent: "첫 주간 리포트는 다음 월요일 아침에 생깁니다." })]],
  [/^#\/weekly\/([\w-]+)$/, "weekly", async (w) => [md(await text(`weekly/${w}.md`))]],
];

async function route() {
  const hash = location.hash || "#/";
  for (const [re, nav, view] of routes) {
    const m = hash.match(re);
    if (!m) continue;
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
    try { await show(...(await view(...m.slice(1)))); }
    catch (e) { await show(el("p", { className: "empty", textContent: `페이지를 불러오지 못했습니다. (${e.message})` })); }
    return;
  }
  location.hash = "#/";
}

(async () => {
  try { site = JSON.parse(await text("data/site.json")); }
  catch { site = { dates: [], weeks: [], titles: {} }; }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
