name: test

on:
  push:
    paths: ["**.py", "config.json", "requirements.txt", ".github/workflows/test.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python test_todaytodo.py # 외부 호출 없이 도는 자가 점검
